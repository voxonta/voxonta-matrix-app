name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The store's Postgres half is the one a deployment runs; it is tested
      # here rather than assumed from the memory store passing.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The capture service from its main branch, for the test that polls this
      # service with its own client: the two are released separately, and
      # drifting apart is exactly what that test is for.
      - name: Install
        run: |
          pip install -e '.[dev]'
          pip install 'nextcloud-talk-capture @ git+https://github.com/voxonta/nextcloud-talk-capture@main'

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: python -m pytest tests -q -rs

  image:
    name: Image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t voxonta-matrix-app:ci .
      - name: Refuses to start half-configured
        run: |
          out=$(docker run --rm voxonta-matrix-app:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "required but not set: MATRIX_HOMESERVER_URL"

  synapse-widget:
    name: Standalone widget adapter (real Synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Start disposable homeserver
        run: |
          mkdir -p /tmp/voxonta-widget-test
          chmod 777 /tmp/voxonta-widget-test
          cp tests/synapse-widget.yaml /tmp/voxonta-widget-test/homeserver.yaml
          cp synapse/voxonta_widget_adapter.py /tmp/voxonta-widget-test/
          docker run -d --name voxonta-widget-test -p 127.0.0.1:18770:8008 \
            -v /tmp/voxonta-widget-test:/data -e PYTHONPATH=/data \
            matrixdotorg/synapse:v1.163.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install integration for automatic-flow check
        run: pip install -e '.[dev]'
      - name: Exercise adapter and automatic flow without a bot or open widget
        run: PYTHONPATH=src:tests python3 tests/synapse_auto_e2e.py
      - name: Homeserver logs on failure
        if: failure()
        run: docker logs --tail 100 voxonta-widget-test
      - name: Clean up
        if: always()
        run: docker rm -f voxonta-widget-test

  installation-bundle:
    name: Independent Matrix installation bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned capture source
        run: echo "CAPTURE_REF=$(cat deploy/capture.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: voxonta/nextcloud-talk-capture
          ref: ${{ env.CAPTURE_REF }}
          path: .capture-source
      - name: Assemble the whole Matrix package
        run: python3 scripts/build_bundle.py --capture-source .capture-source
      - name: Check Compose and build the bundled capture
        run: |
          mkdir /tmp/voxonta-matrix-install
          tar -xzf dist/voxonta-matrix-*.tar.gz -C /tmp/voxonta-matrix-install
          python3 scripts/check_bundle.py /tmp/voxonta-matrix-install/voxonta-matrix
          docker build -t voxonta-matrix-capture:ci /tmp/voxonta-matrix-install/voxonta-matrix/capture
          docker run --rm --entrypoint python voxonta-matrix-capture:ci -c "import runpy; from livekit import rtc; runpy.run_path('/app/src/main.py', run_name='package_test')"
      - uses: actions/upload-artifact@v4
        with:
          name: voxonta-matrix-installation
          path: dist/*
